<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勇者ローグ 属性チェッカー - 対象外一覧</title>
  <style>
    :root { color-scheme: light; --ink:#222; --muted:#666; --line:#ddd; --accent:#4263a5; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px 16px 48px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#f5f6f8; }
    main { max-width:900px; margin:0 auto; }
    h1 { font-size:1.55rem; margin:0 0 8px; }
    .desc { color:var(--muted); margin:0 0 18px; line-height:1.6; }
    .nav { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
    .nav a { color:var(--accent); }
    .panel { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    .attrs { display:flex; flex-wrap:wrap; gap:8px; }
    button.attr, button.reset { border:1px solid #bbb; border-radius:8px; padding:9px 14px; background:#fff; cursor:pointer; font:inherit; }
    button.attr[aria-pressed="true"] { background:var(--accent); color:white; border-color:var(--accent); }
    button.reset { margin-top:12px; background:#f0f0f0; }
    #count { font-weight:700; margin:4px 0 12px; }
    #search { width:100%; max-width:420px; padding:10px 12px; border:1px solid #bbb; border-radius:8px; font:inherit; }
    .list { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
    .monster { background:#fff; border:1px solid var(--line); border-radius:9px; padding:12px; }
    .name { font-weight:700; margin-bottom:5px; }
    .weakness { color:var(--muted); font-size:.92rem; }
    .empty { color:var(--muted); padding:18px 4px; }
    @media (max-width:520px) { body { padding:18px 12px 36px; } h1 { font-size:1.3rem; } }
  </style>
</head>
<body>
<main>
  <h1>勇者ローグ 属性チェッカー：対象外一覧</h1>
  <p class="desc">選択した属性が、すべて弱点に含まれないモンスターを表示します。<br>属性を複数選択できます。選択を解除すると全モンスターを表示します。</p>
  <nav class="nav">
    <a href="target.html">対象一覧へ切り替え</a>
  </nav>
  <section class="panel">
    <div class="attrs" id="attrs" aria-label="属性選択">
      <button class="attr" type="button" data-attr="炎" aria-pressed="false">炎</button><button class="attr" type="button" data-attr="水" aria-pressed="false">水</button><button class="attr" type="button" data-attr="風" aria-pressed="false">風</button><button class="attr" type="button" data-attr="土" aria-pressed="false">土</button><button class="attr" type="button" data-attr="雷" aria-pressed="false">雷</button><button class="attr" type="button" data-attr="闇" aria-pressed="false">闇</button><button class="attr" type="button" data-attr="聖" aria-pressed="false">聖</button>
    </div>
    <button class="reset" id="reset" type="button">選択をリセット</button>
  </section>
  <section class="panel">
    <input id="search" type="search" placeholder="モンスター名で検索" aria-label="モンスター名で検索">
  </section>
  <div id="count" aria-live="polite">読み込み中...</div>
  <div class="list" id="list"></div>
</main>
<script src="./monsters.js"></script>
<script>
(() => {
  const selected = new Set();
  const attrs = document.getElementById("attrs");
  const search = document.getElementById("search");
  const count = document.getElementById("count");
  const list = document.getElementById("list");

  function render() {
    if (!Array.isArray(window.monsters) && typeof monsters === "undefined") {
      count.textContent = "データを読み込めませんでした。monsters.js が同じフォルダにあるか確認してください。";
      list.replaceChildren();
      return;
    }
    const query = search.value.trim().toLowerCase();
    const filtered = monsters.filter(([name, weaknesses]) => {
      const attrMatch = selected.size === 0 || ([...selected].every(attr => !weaknesses.includes(attr)));
      return attrMatch && name.toLowerCase().includes(query);
    });
    count.textContent = `${filtered.length} / ${monsters.length}体`;
    list.replaceChildren();
    if (filtered.length === 0) {
      const message = document.createElement("p");
      message.className = "empty";
      message.textContent = "該当するモンスターはいません。";
      list.append(message);
      return;
    }
    for (const [name, weaknesses] of filtered) {
      const card = document.createElement("article");
      card.className = "monster";
      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = name;
      const weaknessEl = document.createElement("div");
      weaknessEl.className = "weakness";
      weaknessEl.textContent = "弱点：" + (weaknesses || "なし／不明");
      card.append(nameEl, weaknessEl);
      list.append(card);
    }
  }

  attrs.addEventListener("click", event => {
    const button = event.target.closest("button[data-attr]");
    if (!button) return;
    const attr = button.dataset.attr;
    if (selected.has(attr)) selected.delete(attr);
    else selected.add(attr);
    button.setAttribute("aria-pressed", String(selected.has(attr)));
    render();
  });
  document.getElementById("reset").addEventListener("click", () => {
    selected.clear();
    attrs.querySelectorAll("button[data-attr]").forEach(button => button.setAttribute("aria-pressed", "false"));
    search.value = "";
    render();
  });
  search.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
